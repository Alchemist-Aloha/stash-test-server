name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catches breakage from new Stash releases

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        stash-version: ["", latest] # "" = pinned STASH_VERSION
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - id: stash
        uses: ./
        with:
          stash-version: ${{ matrix.stash-version }}
      - name: Show outputs
        run: |
          echo "url=${{ steps.stash.outputs.url }}"
          echo "username=${{ steps.stash.outputs.username }}"
          echo "fixture=${{ steps.stash.outputs.fixture }}"
      - name: Upload Stash log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stash-log-${{ matrix.stash-version || 'pinned' }}
          path: ${{ steps.stash.outputs.data-dir }}/stash.log
          if-no-files-found: ignore
