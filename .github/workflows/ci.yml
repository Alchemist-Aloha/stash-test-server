name: Self-test

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catches breakage from new Stash releases

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        stash-version: [""] # "" = pinned STASH_VERSION
        # Every runner a client GUI job may start the server on.
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-15-intel, windows-latest, windows-11-arm]
        include:
          - os: ubuntu-26.04
            stash-version: latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: stash
        uses: ./
        with:
          stash-version: ${{ matrix.stash-version }}
      - name: Show outputs
        run: |
          echo "url=${{ steps.stash.outputs.url }}"
          echo "username=${{ steps.stash.outputs.username }}"
          echo "fixture=${{ steps.stash.outputs.fixture }}"
      - name: Upload Stash log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stash-log-${{ matrix.os }}-${{ matrix.stash-version || 'pinned' }}
          path: ${{ steps.stash.outputs.data-dir }}/stash.log
          if-no-files-found: ignore
